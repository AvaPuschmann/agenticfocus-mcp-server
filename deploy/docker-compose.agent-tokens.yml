# Complément du compose de production : active le stockage des jetons d'agent (Story 27-10).
#
# Ajoute un VOLUME persistant (les jetons survivent aux redémarrages) et le chemin du fichier. La clé de chiffrement
# AGENT_TOKEN_KEY se met dans le fichier .env (à côté du compose de production), jamais ici ni dans git.
#
# Utilisation (sur le VPS, dossier du compose de production) :
#   docker compose -f docker-compose.prod.yml -f docker-compose.agent-tokens.yml up -d --force-recreate
#
# Le nom du service (« mcp » ci-dessous) doit être celui du compose de production :
#   docker compose -f docker-compose.prod.yml config --services
services:
  mcp:
    environment:
      AGENT_TOKEN_FILE: /data/agent-tokens.json
    volumes:
      - agent-tokens:/data

volumes:
  agent-tokens:
    name: agenticfocus-agent-tokens
